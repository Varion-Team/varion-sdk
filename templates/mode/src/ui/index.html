<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>__TITLE_HTML__</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="hud" class="hud" hidden>
      <section class="chat">
        <ol id="lines" class="lines"></ol>
        <form id="say" class="say">
          <input id="message" type="text" autocomplete="off" spellcheck="false" tabindex="-1" />
        </form>
      </section>

      <header class="brand">
        <p class="title">Varion Mode</p>
        <img class="sign" src="./assets/sign.svg" alt="Varion" />
      </header>

      <ul class="keys when-idle">
        <li><kbd>T</kbd>Chat</li>
      </ul>
      <ul class="keys when-typing">
        <li><kbd>Enter</kbd>Send</li>
        <li><kbd>Esc</kbd>Close</li>
      </ul>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
