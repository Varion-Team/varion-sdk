name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  template:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create a project and type check it
        shell: bash
        run: |
          node bin/varion.mjs new demo --cwd "$RUNNER_TEMP" --no-git --sdk "file:$GITHUB_WORKSPACE"
          node bin/varion.mjs new demo-db --db --cwd "$RUNNER_TEMP" --no-git --sdk "file:$GITHUB_WORKSPACE"
          cd "$RUNNER_TEMP/demo" && npx varion check
          cd "$RUNNER_TEMP/demo-db" && npx varion check
